spring:
  datasource:
    url: jdbc:mysql://localhost:23307/zhimian?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: zhimian
    password: zhimian_local_password
  data:
    redis:
      host: localhost
      port: 26380
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:local-not-configured}
      base-url: ${OPENAI_BASE_URL:https://api.deepseek.com}
      chat:
        options:
          model: ${OPENAI_CHAT_MODEL:deepseek-chat}
      embedding:
        api-key: ${EMBEDDING_API_KEY:local-not-configured}
        base-url: ${EMBEDDING_BASE_URL:https://api.siliconflow.cn}
        options:
          model: ${RAG_EMBEDDING_MODEL:BAAI/bge-m3}
    vectorstore:
      redis:
        index-name: zhimian-knowledge
        prefix: "zhimian:knowledge:"
        initialize-schema: ${RAG_INITIALIZE_SCHEMA:false}

zhimian:
  jwt:
    secret: zhimian-local-development-signing-key-change-before-deployment
